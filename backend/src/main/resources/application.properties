spring.config.import=optional:file:.env[.properties]
spring.application.name=fortpointproperties

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
#change to update later once we have the database schema set up
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.statement_cache.size=0

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# Frontend/OAuth Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth2.frontend-callback-url=${FRONTEND_URL:http://localhost:5173}/auth/google/callback
app.oauth2.frontend-login-url=${FRONTEND_URL:http://localhost:5173}/login
app.cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:5174,http://127.0.0.1:5173,http://10.0.2.2:8080,https://*.vercel.app}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=career-resumes
supabase.article-bucket=article-cover-photos
supabase.property-photo-bucket=property-photos
supabase.profile-image-bucket=profile-images
supabase.storage.signed-url-expiration-seconds=300

# SonarQube Cloud / Server configuration for the whole monorepo.
# 1. Create the project on sonarcloud.io (or your SonarQube server) and set the two values below.
# 2. Add a SONAR_TOKEN repository secret in GitHub. The "sonar" CI job then runs automatically.
sonar.organization=CHANGE_ME
sonar.projectKey=CHANGE_ME_fortpointproperties
sonar.projectName=FortPoint Properties

sonar.sourceEncoding=UTF-8

# --- Sources / tests -----------------------------------------------------
sonar.sources=web/src,backend/src/main/java
sonar.tests=web/src,backend/src/test/java
sonar.test.inclusions=web/src/**/*.test.js,web/src/**/*.test.jsx,web/src/**/*.test.ts,web/src/**/*.test.tsx,backend/src/test/java/**
sonar.exclusions=web/src/**/*.test.*,web/src/test/**,web/src/assets/**

# --- Java ------------------------------------------------------------------
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- JavaScript / TypeScript ---------------------------------------------
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# DTO/entity boilerplate and bootstrap code are not meaningful coverage targets
sonar.coverage.exclusions=backend/src/main/java/**/dto/**,backend/src/main/java/**/entity/**,backend/src/main/java/**/FortpointpropertiesApplication.java,web/src/main.jsx,web/src/**/index.js

# Activated automatically by maven-surefire (see pom.xml).
# Isolates tests from real infrastructure: in-memory DB + dummy secrets.
# NEVER put real credentials here.

spring.datasource.url=jdbc:h2:mem:fortpoint;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 64+ byte dummy key (HS512 requirement)
jwt.secret=test-only-secret-key-test-only-secret-key-test-only-secret-key-0123456789

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

supabase.url=http://localhost:54321
supabase.service-role-key=test-service-role-key

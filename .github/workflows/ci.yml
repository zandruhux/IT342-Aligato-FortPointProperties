name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint (warning budget)
        run: npm run lint:ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Prettier (informational until the one-time format commit)
        run: npm run format:check
        continue-on-error: true
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 7

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  backend:
    name: Backend (tests, ArchUnit, Checkstyle, SpotBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/checkstyle-result.xml
            backend/target/spotbugsXml.xml
          retention-days: 14

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Runs only once the SONAR_TOKEN repository secret is configured.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build backend + coverage
        if: env.SONAR_TOKEN != ''
        run: cd backend && ./mvnw -B -ntp verify -Dcheckstyle.skip -Dspotbugs.skip
      - name: Frontend coverage
        if: env.SONAR_TOKEN != ''
        run: cd web && npm ci && npm run test:coverage
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
